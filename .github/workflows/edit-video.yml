name: "Video Edit Pipeline"

on:
  workflow_dispatch:
    inputs:
      video_file:
        description: "Raw video filename in /raw folder"
        required: true
        default: "input.mp4"
      mode:
        description: "Editing mode"
        required: true
        type: choice
        options:
          - basic_trim
          - color_grade
          - add_subtitles
          - full_automation
      output_format:
        description: "Output format (mp4)"
        required: false
        default: "mp4"

env:
  FFMPEG_PATH: /usr/bin/ffmpeg

jobs:
  edit-video:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify video exists
        run: |
          if [ ! -f "raw/${{ github.event.inputs.video_file }}" ]; then
            echo "❌ Video not found in /raw/ folder"
            ls -la raw/
            exit 1
          fi
          echo "✅ Found video: ${{ github.event.inputs.video_file }}"

      - name: Run editing pipeline
        run: |
          mkdir -p edited

          case "${{ github.event.inputs.mode }}" in
            "basic_trim")
              ffmpeg -y -i "raw/${{ github.event.inputs.video_file }}" \
                -c:v libx264 -preset fast -crf 23 \
                "edited/${{ github.event.inputs.video_file }}.trimmed.mp4"
              ;;

            "color_grade")
              ffmpeg -y -i "raw/${{ github.event.inputs.video_file }}" \
                -vf "eq=contrast=1.2:brightness=0.1:saturation=1.15" \
                -c:v libx264 -preset medium -crf 22 \
                "edited/${{ github.event.inputs.video_file }}.graded.mp4"
              ;;

            "add_subtitles")
              ffmpeg -y -i "raw/${{ github.event.inputs.video_file }}" \
                -vf "subtitles=raw/${{ github.event.inputs.video_file }}" \
                -c:v libx264 -preset fast -crf 23 \
                "edited/${{ github.event.inputs.video_file }}.with_subs.mp4" 2>/dev/null || \
              cp "raw/${{ github.event.inputs.video_file }}" \
                "edited/${{ github.event.inputs.video_file }}.subbed.mp4"
              ;;

            "full_automation")
              ffmpeg -y -i "raw/${{ github.event.inputs.video_file }}" \
                -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2,setsar=1" \
                -c:v libx264 -preset medium -crf 22 -c:a aac -b:a 128k \
                "edited/${{ github.event.inputs.video_file }}.final.mp4"
              ;;
          esac

      - name: Verify output
        run: |
          if [ "$(ls -A edited/)" ]; then
            echo "✅ Video edited successfully"
            file edited/*.mp4
          else
            echo "❌ No output video created"
            exit 1
          fi

      - name: Upload edited video
        uses: actions/upload-artifact@v4
        with:
          name: edited-video-${{ github.run_id }}
          path: edited/
          retention-days: 7
          if-no-files-found: error
